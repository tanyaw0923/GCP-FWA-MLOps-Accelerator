project_id: fwa-mlops-accelerator-demo
region: us-central1
bucket: fwa-mlops-accelerator-demo-folder


# ============================================================
# MODEL CONFIGURATION
#
# Use Case 3:
# Change only model_type:
#
#   random_forest
#        ↓
#   xgboost
#
# The rest of the MLOps workflow remains reusable.
# ============================================================

model:
  model_type: xgboost

  positive_class: 1
  normal_class: 0

  random_forest:
    model_name: random_forest
    experiment_name: provider_eye_fraud_random_forest

    parameters:
      n_estimators: 300
      max_depth: 5
      min_samples_leaf: 2
      class_weight: balanced
      random_state: 42
      n_jobs: -1

    training_image: us-central1-docker.pkg.dev/fwa-mlops-accelerator-demo/fwa-mlops/random-forest-training:v2

    serving_container_image_uri: us-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-6:latest


  xgboost:
    model_name: xgboost
    experiment_name: provider_eye_fraud_xgboost

    parameters:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.80
      colsample_bytree: 0.80
      scale_pos_weight: 9.0
      eval_metric: logloss
      random_state: 42
      n_jobs: -1

    training_image: us-central1-docker.pkg.dev/fwa-mlops-accelerator-demo/fwa-mlops/xgboost-training:v1

    serving_container_image_uri: us-docker.pkg.dev/vertex-ai/prediction/xgboost-cpu.2-1:latest


# ============================================================
# EXPERIMENT TRACKING
#
# experiment_id:
#   generated from experiment_name
#
# run_id:
#   generated for every pipeline execution
#
# feature_version:
#   generated from the feature signature
#
# dataset_version:
#   uses current_data_month
#
# git_commit:
#   captured from the Git repository at runtime
# ============================================================

experiment_tracking:
  owner: data_science_team


# ============================================================
# DATA
#
# Use Case 1:
# New monthly data becomes available.
#
# Use Case 2:
# Same data month, but new features become available.
#
# Use Case 3:
# Same data + same features, but a new model idea is tested.
# ============================================================

data:
  current_data_month: "2026-09-01"

  rolling_window:
    training_months: 6
    testing_months: 3

  claims_table: fwa-mlops-accelerator-demo.fwa_claims.claims

  feature_table: fwa-mlops-accelerator-demo.fraud_features.provider_eye_features

  feedback_table: fwa-mlops-accelerator-demo.fraud_feedback.investigation_results

  experiment_runs_table: fwa-mlops-accelerator-demo.fraud_experiments.experiment_runs

  experiment_metrics_table: fwa-mlops-accelerator-demo.fraud_experiments.experiment_metrics
  
  random_forest_batch_input_table: fwa-mlops-accelerator-demo.fraud_features.random_forest_batch_input

  xgboost_batch_input_table: fwa-mlops-accelerator-demo.fraud_features.xgboost_batch_input  

  provider_prediction_table: fwa-mlops-accelerator-demo.fraud_experiments.provider_predictions

  retraining_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_retraining

  provider_feature_history_table: fwa-mlops-accelerator-demo.fraud_features.provider_feature_history


# ============================================================
# PROVIDER-LEVEL FEATURE ENGINEERING
#
# These definitions are model-independent.
#
# Use Case 2:
# avg_member_provider_distance was added as a new feature.
# ============================================================

feature_sql:
  high_acuity_pct: "AVG(CAST(is_high_acuity_em AS FLOAT64))"

  pct_99214: "AVG(CAST(is_99214 AS FLOAT64))"

  pct_99215: "AVG(CAST(is_99215 AS FLOAT64))"

  referral_rate: "AVG(CAST(is_referral AS FLOAT64))"

  eye_procedure_pct: "AVG(CAST(is_eye_procedure AS FLOAT64))"

  avg_paid_per_claim: "AVG(total_paid_amount)"

  #avg_member_provider_distance: "AVG(member_provider_distance)"


# ============================================================
# DERIVED FEATURES
# ============================================================

derived_feature_sql:
  high_acuity_oe_ratio: >
    SAFE_DIVIDE(
      p.high_acuity_pct,
      b.expected_high_acuity_pct
    )


# ============================================================
# MODEL FEATURES
#
# Shared feature set used by both Random Forest and XGBoost.
#
# Individual model-specific feature sets can be added later
# if needed.
# ============================================================

features:
  - high_acuity_pct
  - pct_99214
  - pct_99215
  - referral_rate
  - eye_procedure_pct
  - avg_paid_per_claim
  - high_acuity_oe_ratio
  #- avg_member_provider_distance


# ============================================================
# MONITORING
#
# Monitoring stays shared across model types.
# ============================================================

monitoring:
  feature_shift_threshold: 0.10
  prediction_shift_threshold: 0.10
  baseline_positive_rate: 0.10

  data_quality_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_data_quality

  feature_drift_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_feature_drift

  prediction_drift_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_prediction_drift

  training_state_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_training_state

  performance_degradation_table: fwa-mlops-accelerator-demo.fraud_monitoring.model_performance_degradation

  performance_min_completed_cases: 20

  precision_degradation_threshold: 0.10
  recall_degradation_threshold: 0.10
  f1_degradation_threshold: 0.10


# ============================================================
# MODEL PROMOTION
#
# Candidate and production artifact locations are selected
# dynamically based on model_type.
# ============================================================

promotion:
  require_manual_approval: true

  gate:
    min_pr_auc_improvement: 0.00
    min_recall_change: 0.00
    min_f1_change: 0.00
    min_precision_change: -0.05

  candidate_status:
    pending: PENDING_APPROVAL
    approved: APPROVED
    rejected: REJECTED

  random_forest:
    candidate_artifact_path: models/random_forest/candidate/
    production_artifact_path: models/random_forest/production/

  xgboost:
    candidate_artifact_path: models/xgboost/candidate/
    production_artifact_path: models/xgboost/production/


# ============================================================
# FEATURE STORE
#
# Interview-demo design:
#
# One monthly refresh produces two feature horizons:
#
#   1) long-term provider profile
#      - trailing 6 months
#
#   2) short-term behavioral snapshot
#      - trailing 7 days
#
# Both horizons are written to one timestamped BigQuery history
# table. Vertex AI Feature Store registers the same canonical
# source for reuse and future online serving.
# ============================================================

feature_store:
  enabled: true

  feature_group_id: eye_provider_fraud_features

  online_store_id: provider_fraud_online_store

  feature_view_id: eye_provider_fraud_feature_view

  history_table: fwa-mlops-accelerator-demo.fraud_features.provider_feature_history

  entity_id_column: entity_id

  feature_timestamp_column: feature_timestamp

  refresh:
    cadence: monthly
    long_term_months: 6
    short_term_days: 7

  short_term_features:
    - claim_count_7d
    - high_acuity_pct_7d
    - referral_rate_7d
    - avg_paid_per_claim_7d
    - avg_member_provider_distance_7d
    - high_acuity_oe_ratio_7d
