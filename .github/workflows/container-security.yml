name: Container Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: random-forest-training
            dockerfile: docker/random_forest/Dockerfile
          - name: random-forest-serving
            dockerfile: docker/random-forest-serving/Dockerfile
          - name: xgboost-training
            dockerfile: docker/xgboost/Dockerfile
          - name: xgboost-serving
            dockerfile: docker/xgboost-serving/Dockerfile
          - name: performance-monitoring
            dockerfile: docker/performance-monitoring/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "fwa-scan/${{ matrix.name }}:ci" .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "fwa-scan/${{ matrix.name }}:ci"
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
