name: KFP Pipeline Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install KFP
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://pypi.org/simple kfp==2.17.3

      - name: Compile pipeline
        run: python -m src.pipeline.model_training_pipeline

      - name: Verify compiled pipeline exists
        run: test -s model_training_pipeline.yaml
