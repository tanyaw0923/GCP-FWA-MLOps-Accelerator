        pipelinechannel--serving_container_image_uri:
          parameterType: STRING
        pipelinechannel--state_key:
          parameterType: STRING
        pipelinechannel--training_state_table:
          parameterType: STRING
  comp-condition-3:
    dag:
      tasks:
        mark-candidate-pending-component-2:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-mark-candidate-pending-component-2
          dependentTasks:
