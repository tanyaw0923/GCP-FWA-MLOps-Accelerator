                componentInputParameter: pipelinechannel--feature_columns_json
              feature_table:
                componentInputParameter: pipelinechannel--feature_table
              model_output_uri:
                componentInputParameter: pipelinechannel--model_output_uri
              model_parameters_json:
                componentInputParameter: pipelinechannel--model_parameters_json
              project_id:
                componentInputParameter: pipelinechannel--project_id
          taskInfo:
            name: Train XGBoost Candidate
    inputDefinitions:
      parameters:
        pipelinechannel--check-retraining-decision-component-Output:
          parameterType: BOOLEAN
        pipelinechannel--current_data_month:
          parameterType: STRING
        pipelinechannel--current_feature_signature:
