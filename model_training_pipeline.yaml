        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef refresh_provider_features_component(\n    project_id: str,\n\
          \    claims_table: str,\n    output_feature_table: str,\n    feature_sql_json:\
          \ str,\n    derived_feature_sql_json: str,\n    train_start_date: str,\n\
          \    train_end_date: str,\n    test_start_date: str,\n    test_end_date:\
          \ str,\n):\n    import json\n    import re\n\n    from google.cloud import\
          \ bigquery\n\n\n    # ============================================================\n\
          \    # 1. PARSE FEATURE DEFINITIONS\n    #\n    # Base features and derived\
          \ features are passed into the\n    # component as JSON so the same pipeline\
          \ can support different\n    # feature sets without rewriting this component.\n\
          \    #\n    # Example:\n    #\n    # {\n    #   \"high_acuity_pct\":\n \
          \   #       \"AVG(CAST(is_high_acuity_em AS FLOAT64))\",\n    #\n    # \
          \  \"avg_member_provider_distance\":\n    #       \"AVG(member_provider_distance)\"\
          \n    # }\n    #\n    # Use Case 2 simply adds a new feature definition\
          \ to the config.\n    # ============================================================\n\
          \n    feature_sql = json.loads(\n        feature_sql_json\n    )\n\n   \
          \ derived_feature_sql = json.loads(\n        derived_feature_sql_json\n\
          \    )\n\n    if not feature_sql:\n        raise ValueError(\n         \
          \   \"feature_sql_json is empty.\"\n        )\n\n\n    # ============================================================\n\
          \    # 2. VALIDATE FEATURE NAMES\n    #\n    # Feature names are used when\
          \ dynamically building SQL, so only\n    # standard SQL-safe column names\
          \ are allowed.\n    # ============================================================\n\
          \n    feature_name_pattern = (\n        r\"^[A-Za-z_][A-Za-z0-9_]*$\"\n\
          \    )\n\n    all_feature_names = (\n        list(feature_sql.keys())\n\
          \        + list(derived_feature_sql.keys())\n    )\n\n    for feature_name\
          \ in all_feature_names:\n        if not re.fullmatch(\n            feature_name_pattern,\n\
          \            feature_name,\n        ):\n            raise ValueError(\n\
          \                f\"Invalid feature name: \"\n                f\"{feature_name}\"\
          \n            )\n\n\n    # ============================================================\n\
          \    # 3. VALIDATE BIGQUERY TABLE NAMES\n    # ============================================================\n\
          \n    table_pattern = (\n        r\"^[A-Za-z0-9_-]+\\.\"\n        r\"[A-Za-z0-9_]+\\\
          .\"\n        r\"[A-Za-z0-9_]+$\"\n    )\n\n    for table_name in [\n   \
          \     claims_table,\n        output_feature_table,\n    ]:\n        if not\
          \ re.fullmatch(\n            table_pattern,\n            table_name,\n \
          \       ):\n            raise ValueError(\n                f\"Invalid BigQuery\
          \ table: \"\n                f\"{table_name}\"\n            )\n\n\n    client\
          \ = bigquery.Client(\n        project=project_id\n    )\n\n\n    # ============================================================\n\
          \    # 4. BUILD BASE FEATURE SQL\n    #\n    # Each configured claim-level\
          \ expression is aggregated to the\n    # provider level.\n    #\n    # Examples:\n\
          \    #\n    # AVG(CAST(is_99215 AS FLOAT64))\n    #     AS pct_99215\n \
          \   #\n    # AVG(member_provider_distance)\n    #     AS avg_member_provider_distance\n\
          \    #\n    # The second example is the feature introduced in Use Case 2.\n\
          \    # ============================================================\n\n\
          \    aggregate_feature_expressions = []\n\n    for (\n        feature_name,\n\
          \        sql_expression,\n    ) in feature_sql.items():\n\n        aggregate_feature_expressions.append(\n\
          \            f\"\"\"\n            {sql_expression}\n              AS {feature_name}\n\
          \            \"\"\"\n        )\n\n    aggregate_feature_sql = \",\\n\".join(\n\
          \        aggregate_feature_expressions\n    )\n\n\n    # ============================================================\n\
          \    # 5. SPLIT-LEVEL BASELINE\n    #\n    # high_acuity_oe_ratio depends\
          \ on a peer baseline calculated\n    # separately for TRAIN and TEST.\n\
          \    #\n    # These baseline values are supporting metadata rather than\n\
          \    # direct Random Forest inputs.\n    # ============================================================\n\
          \n    baseline_sql = \"\"\"\n        AVG(high_acuity_pct)\n          AS\
          \ expected_high_acuity_pct\n    \"\"\"\n\n\n    # ============================================================\n\
          \    # 6. BUILD DERIVED FEATURE SQL\n    #\n    # Derived features are calculated\
          \ after provider aggregation.\n    #\n    # Example:\n    #\n    # SAFE_DIVIDE(\n\
          \    #     p.high_acuity_pct,\n    #     b.expected_high_acuity_pct\n  \
          \  # )\n    #\n    #     AS high_acuity_oe_ratio\n    # ============================================================\n\
          \n    derived_expressions = []\n\n    for (\n        feature_name,\n   \
          \     sql_expression,\n    ) in derived_feature_sql.items():\n\n       \
          \ derived_expressions.append(\n            f\"\"\"\n            {sql_expression}\n\
          \              AS {feature_name}\n            \"\"\"\n        )\n\n    if\
          \ derived_expressions:\n        derived_select_sql = (\n            \",\\\
          n\"\n            + \",\\n\".join(\n                derived_expressions\n\
          \            )\n        )\n    else:\n        derived_select_sql = \"\"\n\
          \n\n    # ============================================================\n\
          \    # 7. BUILD FINAL BASE FEATURE SELECT\n    # ============================================================\n\
          \n    base_feature_select = []\n\n    for feature_name in feature_sql.keys():\n\
          \        base_feature_select.append(\n            f\"p.{feature_name}\"\n\
          \        )\n\n    base_feature_select_sql = \",\\n\".join(\n        base_feature_select\n\
          \    )\n\n\n    # ============================================================\n\
          \    # 8. CREATE ROLLING PROVIDER FEATURE TABLE\n    #\n    # Use Case 1:\n\
          \    #\n    # TRAIN and TEST are assigned dynamically from service_date.\n\
          \    #\n    # Example for:\n    #\n    # current_data_month = 2026-10-01\n\
          \    #\n    # TRAIN:\n    # 2026-02-01 -> 2026-07-31\n    #\n    # TEST:\n\
          \    # 2026-08-01 -> 2026-10-31\n    #\n    # There are no hard-coded split\
          \ dates in this component.\n    #\n    #\n    # Use Case 2:\n    #\n   \
          \ # member_provider_distance already exists in raw claims.\n    # Adding:\n\
          \    #\n    # AVG(member_provider_distance)\n    #\n    # to feature_sql\
          \ automatically creates the new provider-level\n    # feature without changing\
          \ this component.\n    #\n    #\n    # fraud_provider_label is synthetic\
          \ ground truth used only for\n    # this demo. It allows Random Forest to\
          \ train on TRAIN and\n    # evaluate on TEST.\n    # ============================================================\n\
          \n    query = f\"\"\"\n    CREATE OR REPLACE TABLE\n    `{output_feature_table}`\
          \ AS\n\n    WITH claim_windows AS (\n\n      SELECT\n        *,\n\n    \
          \    CASE\n          WHEN service_date BETWEEN\n               DATE(@train_start_date)\n\
          \               AND DATE(@train_end_date)\n            THEN 'TRAIN'\n\n\
          \          WHEN service_date BETWEEN\n               DATE(@test_start_date)\n\
          \               AND DATE(@test_end_date)\n            THEN 'TEST'\n\n  \
          \        ELSE NULL\n        END AS rolling_dataset_split\n\n      FROM `{claims_table}`\n\
          \n      WHERE service_date BETWEEN\n        DATE(@train_start_date)\n  \
          \      AND DATE(@test_end_date)\n    ),\n\n    provider_base AS (\n\n  \
          \    SELECT\n        provider_id,\n\n        ANY_VALUE(\n          provider_name\n\
          \        ) AS provider_name,\n\n        ANY_VALUE(\n          provider_specialty\n\
          \        ) AS provider_specialty,\n\n        ANY_VALUE(\n          provider_city\n\
          \        ) AS provider_city,\n\n        ANY_VALUE(\n          provider_state\n\
          \        ) AS provider_state,\n\n        rolling_dataset_split\n       \
          \   AS dataset_split,\n\n        MAX(\n          fraud_provider_label\n\
          \        ) AS fraud_label,\n\n        COUNT(*)\n          AS claim_count,\n\
          \n        COUNT(\n          DISTINCT member_id\n        ) AS unique_members,\n\
          \n        {aggregate_feature_sql}\n\n      FROM claim_windows\n\n      WHERE\n\
          \        rolling_dataset_split\n        IS NOT NULL\n\n      GROUP BY\n\
          \        provider_id,\n        rolling_dataset_split\n    ),\n\n    split_baseline\
          \ AS (\n\n      SELECT\n        dataset_split,\n\n        {baseline_sql}\n\
          \n      FROM provider_base\n\n      GROUP BY\n        dataset_split\n  \
          \  )\n\n    SELECT\n      p.provider_id,\n      p.provider_name,\n     \
          \ p.provider_specialty,\n      p.provider_city,\n      p.provider_state,\n\
          \n      p.dataset_split,\n      p.fraud_label,\n\n      p.claim_count,\n\
          \      p.unique_members,\n\n      {base_feature_select_sql}\n\n      {derived_select_sql}\n\
          \n    FROM provider_base p\n\n    LEFT JOIN split_baseline b\n      USING(dataset_split)\n\
          \n    ORDER BY\n      dataset_split,\n      provider_id\n    \"\"\"\n\n\n\
          \    # ============================================================\n  \
          \  # 9. EXECUTE FEATURE REFRESH\n    # ============================================================\n\
          \n    job_config = bigquery.QueryJobConfig(\n        query_parameters=[\n\
          \            bigquery.ScalarQueryParameter(\n                \"train_start_date\"\
          ,\n                \"STRING\",\n                train_start_date,\n    \
          \        ),\n            bigquery.ScalarQueryParameter(\n              \
          \  \"train_end_date\",\n                \"STRING\",\n                train_end_date,\n\
          \            ),\n            bigquery.ScalarQueryParameter(\n          \
          \      \"test_start_date\",\n                \"STRING\",\n             \
          \   test_start_date,\n            ),\n            bigquery.ScalarQueryParameter(\n\
          \                \"test_end_date\",\n                \"STRING\",\n     \
          \           test_end_date,\n            ),\n        ]\n    )\n\n    print(\"\
          =\" * 65)\n    print(\"REFRESH PROVIDER FEATURES\")\n    print(\"=\" * 65)\n\
          \n    print(\n        f\"TRAIN: \"\n        f\"{train_start_date} \"\n \
          \       f\"to {train_end_date}\"\n    )\n\n    print(\n        f\"TEST:\
          \  \"\n        f\"{test_start_date} \"\n        f\"to {test_end_date}\"\n\
          \    )\n\n    print(\n        \"\\nBase features:\"\n    )\n\n    for feature_name\
          \ in feature_sql:\n        print(\n            f\"  - {feature_name}\"\n\
          \        )\n\n    if derived_feature_sql:\n        print(\n            \"\
          \\nDerived features:\"\n        )\n\n        for feature_name in derived_feature_sql:\n\
          \            print(\n                f\"  - {feature_name}\"\n         \
          \   )\n\n    client.query(\n        query,\n        job_config=job_config,\n\
          \    ).result()\n\n\n    # ============================================================\n\
          \    # 10. VERIFY OUTPUT\n    #\n    # Confirm both rolling splits were\
          \ created and show:\n    #\n    # - number of providers\n    # - number\
          \ of claims\n    # - fraud / normal provider counts\n    #\n    # This output\
          \ is useful during the Vertex Pipeline demo.\n    # ============================================================\n\
          \n    verify_query = f\"\"\"\n    SELECT\n      dataset_split,\n\n     \
          \ COUNT(*) AS provider_rows,\n\n      SUM(claim_count)\n        AS claims_used,\n\
          \n      COUNTIF(\n        fraud_label = 1\n      ) AS fraud_providers,\n\
          \n      COUNTIF(\n        fraud_label = 0\n      ) AS normal_providers\n\
          \n    FROM `{output_feature_table}`\n\n    GROUP BY\n      dataset_split\n\
          \n    ORDER BY\n      dataset_split\n    \"\"\"\n\n    rows = list(\n  \
          \      client.query(\n            verify_query\n        ).result()\n   \
          \ )\n\n    if not rows:\n        raise RuntimeError(\n            \"Feature\
          \ refresh produced no rows.\"\n        )\n\n    split_names = {\n      \
          \  row.dataset_split\n        for row in rows\n    }\n\n    required_splits\
          \ = {\n        \"TRAIN\",\n        \"TEST\",\n    }\n\n    missing_splits\
          \ = (\n        required_splits\n        - split_names\n    )\n\n    if missing_splits:\n\
          \        raise RuntimeError(\n            \"Feature refresh is missing \"\
          \n            f\"dataset split(s): \"\n            f\"{sorted(missing_splits)}\"\
          \n        )\n\n\n    # ============================================================\n\
          \    # 11. PRINT FEATURE REFRESH SUMMARY\n    # ============================================================\n\
          \n    print(\n        \"\\nFeature refresh complete:\"\n    )\n\n    for\
          \ row in rows:\n        print(\n            f\"\\n{row.dataset_split}\"\n\
          \        )\n\n        print(\n            f\"  Providers: \"\n         \
          \   f\"{row.provider_rows}\"\n        )\n\n        print(\n            f\"\
          \  Claims used: \"\n            f\"{row.claims_used}\"\n        )\n\n  \
          \      print(\n            f\"  Fraud providers: \"\n            f\"{row.fraud_providers}\"\
          \n        )\n\n        print(\n            f\"  Normal providers: \"\n \
          \           f\"{row.normal_providers}\"\n        )\n\n\n    # ============================================================\n\
          \    # 12. FEATURE VALIDATION\n    #\n    # Check whether any generated\
          \ feature contains NULL values.\n    #\n    # This prevents Random Forest\
          \ training from starting with an\n    # invalid provider-level dataset.\n\
          \    # ============================================================\n\n\
          \    all_model_features = (\n        list(feature_sql.keys())\n        +\
          \ list(\n            derived_feature_sql.keys()\n        )\n    )\n\n  \
          \  null_checks = []\n\n    for feature_name in all_model_features:\n   \
          \     null_checks.append(\n            f\"\"\"\n            COUNTIF(\n \
          \             {feature_name} IS NULL\n            ) AS {feature_name}_nulls\n\
          \            \"\"\"\n        )\n\n    null_check_sql = \",\\n\".join(\n\
          \        null_checks\n    )\n\n    validation_query = f\"\"\"\n    SELECT\n\
          \      {null_check_sql}\n    FROM `{output_feature_table}`\n    \"\"\"\n\
          \n    validation_rows = list(\n        client.query(\n            validation_query\n\
          \        ).result()\n    )\n\n    if not validation_rows:\n        raise\
          \ RuntimeError(\n            \"Feature validation query \"\n           \
          \ \"returned no result.\"\n        )\n\n    validation_row = (\n       \
          \ validation_rows[0]\n    )\n\n    null_feature_counts = {}\n\n    for feature_name\
          \ in all_model_features:\n        null_count = getattr(\n            validation_row,\n\
          \            f\"{feature_name}_nulls\",\n        )\n\n        null_feature_counts[\n\
          \            feature_name\n        ] = null_count\n\n    features_with_nulls\
          \ = {\n        feature_name: null_count\n        for (\n            feature_name,\n\
          \            null_count,\n        ) in null_feature_counts.items()\n   \
          \     if null_count > 0\n    }\n\n    if features_with_nulls:\n        raise\
          \ RuntimeError(\n            \"NULL values found in \"\n            f\"\
          provider features: \"\n            f\"{features_with_nulls}\"\n        )\n\
          \n    print(\n        \"\\nFeature validation: PASS\"\n    )\n\n    print(\n\
          \        \"No NULL values found in \"\n        \"configured model features.\"\
          \n    )\n\n"
        image: python:3.11
    exec-register-model-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model_component(\n    project_id: str,\n    region:\
          \ str,\n    model_display_name: str,\n    artifact_uri: str,\n    serving_container_image_uri:\
          \ str,\n) -> str:\n    from google.cloud import aiplatform\n\n    aiplatform.init(\n\
          \        project=project_id,\n        location=region,\n    )\n\n    print(\"\
          =\" * 60)\n    print(\"Registering Random Forest Model\")\n    print(\"\
          =\" * 60)\n\n    print(\n        f\"Project: \"\n        f\"{project_id}\"\
          \n    )\n\n    print(\n        f\"Region: \"\n        f\"{region}\"\n  \
          \  )\n\n    print(\n        f\"Model display name: \"\n        f\"{model_display_name}\"\
          \n    )\n\n    print(\n        f\"Artifact URI: \"\n        f\"{artifact_uri}\"\
          \n    )\n\n    print(\n        f\"Serving container: \"\n        f\"{serving_container_image_uri}\"\
          \n    )\n\n    model = aiplatform.Model.upload(\n        display_name=model_display_name,\n\
          \        artifact_uri=artifact_uri,\n        serving_container_image_uri=serving_container_image_uri,\n\
          \        sync=True,\n    )\n\n    print(\"\\nModel registered successfully.\"\
          )\n\n    print(\n        f\"Model resource name: \"\n        f\"{model.resource_name}\"\
          \n    )\n\n    return model.resource_name\n\n"
        image: python:3.11
    exec-register-model-component-2:
      container:
