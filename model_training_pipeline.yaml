# PIPELINE DEFINITION
# Name: fraud-model-training
# Description: Reusable provider-level fraud detection pipeline supporting Random Forest and XGBoost with shared feature engineering, retraining logic, model registration, and manual approval.
# Inputs:
#    claims_table: str
#    current_data_month: str
#    current_feature_signature: str
#    current_model_signature: str
#    data_quality_table: str
#    derived_feature_sql_json: str
#    feature_columns_json: str
#    feature_drift_table: str
#    feature_sql_json: str
#    feature_table: str
#    model_artifact_uri: str
#    model_display_name: str
#    model_name: str
#    model_output_uri: str
#    model_parameters_json: str
#    model_type: str
#    prediction_drift_table: str
#    project_id: str
#    region: str
#    serving_container_image_uri: str
#    state_key: str [Default: 'provider_fraud_model_rf']
#    testing_months: int
#    training_months: int
#    training_state_table: str
components:
  comp-calculate-rolling-window-component:
    executorLabel: exec-calculate-rolling-window-component
    inputDefinitions:
      parameters:
        current_data_month:
          parameterType: STRING
        testing_months:
          parameterType: NUMBER_INTEGER
        training_months:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        test_end_date:
          parameterType: STRING
        test_start_date:
          parameterType: STRING
        train_end_date:
          parameterType: STRING
        train_start_date:
          parameterType: STRING
  comp-check-retraining-decision-component:
    executorLabel: exec-check-retraining-decision-component
    inputDefinitions:
      parameters:
        current_data_month:
          parameterType: STRING
        current_feature_signature:
          parameterType: STRING
        current_model_signature:
          parameterType: STRING
        current_model_type:
          parameterType: STRING
        data_quality_table:
          parameterType: STRING
        feature_drift_table:
          parameterType: STRING
        prediction_drift_table:
          parameterType: STRING
        project_id:
          parameterType: STRING
        state_key:
          defaultValue: provider_fraud_model_rf
          isOptional: true
          parameterType: STRING
        training_state_table:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: BOOLEAN
  comp-condition-1:
    dag:
      tasks:
        calculate-rolling-window-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-calculate-rolling-window-component
          inputs:
            parameters:
              current_data_month:
                componentInputParameter: pipelinechannel--current_data_month
              testing_months:
                componentInputParameter: pipelinechannel--testing_months
              training_months:
                componentInputParameter: pipelinechannel--training_months
          taskInfo:
            name: Calculate Rolling Window
        condition-2:
          componentRef:
            name: comp-condition-2
          dependentTasks:
          - refresh-provider-features-component
          inputs:
            parameters:
              pipelinechannel--check-retraining-decision-component-Output:
                componentInputParameter: pipelinechannel--check-retraining-decision-component-Output
              pipelinechannel--current_data_month:
                componentInputParameter: pipelinechannel--current_data_month
              pipelinechannel--current_feature_signature:
                componentInputParameter: pipelinechannel--current_feature_signature
              pipelinechannel--current_model_signature:
                componentInputParameter: pipelinechannel--current_model_signature
              pipelinechannel--feature_columns_json:
                componentInputParameter: pipelinechannel--feature_columns_json
              pipelinechannel--feature_table:
                componentInputParameter: pipelinechannel--feature_table
              pipelinechannel--model_artifact_uri:
                componentInputParameter: pipelinechannel--model_artifact_uri
              pipelinechannel--model_display_name:
                componentInputParameter: pipelinechannel--model_display_name
              pipelinechannel--model_output_uri:
                componentInputParameter: pipelinechannel--model_output_uri
              pipelinechannel--model_parameters_json:
                componentInputParameter: pipelinechannel--model_parameters_json
              pipelinechannel--model_type:
                componentInputParameter: pipelinechannel--model_type
              pipelinechannel--project_id:
                componentInputParameter: pipelinechannel--project_id
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--serving_container_image_uri:
                componentInputParameter: pipelinechannel--serving_container_image_uri
              pipelinechannel--state_key:
                componentInputParameter: pipelinechannel--state_key
              pipelinechannel--training_state_table:
                componentInputParameter: pipelinechannel--training_state_table
          taskInfo:
            name: random-forest-model
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--model_type'] == 'random_forest'
        condition-3:
          componentRef:
            name: comp-condition-3
          dependentTasks:
          - refresh-provider-features-component
          inputs:
            parameters:
              pipelinechannel--check-retraining-decision-component-Output:
                componentInputParameter: pipelinechannel--check-retraining-decision-component-Output
              pipelinechannel--current_data_month:
                componentInputParameter: pipelinechannel--current_data_month
              pipelinechannel--current_feature_signature:
                componentInputParameter: pipelinechannel--current_feature_signature
              pipelinechannel--current_model_signature:
                componentInputParameter: pipelinechannel--current_model_signature
              pipelinechannel--feature_columns_json:
                componentInputParameter: pipelinechannel--feature_columns_json
              pipelinechannel--feature_table:
                componentInputParameter: pipelinechannel--feature_table
              pipelinechannel--model_artifact_uri:
                componentInputParameter: pipelinechannel--model_artifact_uri
              pipelinechannel--model_display_name:
                componentInputParameter: pipelinechannel--model_display_name
              pipelinechannel--model_output_uri:
                componentInputParameter: pipelinechannel--model_output_uri
              pipelinechannel--model_parameters_json:
                componentInputParameter: pipelinechannel--model_parameters_json
              pipelinechannel--model_type:
                componentInputParameter: pipelinechannel--model_type
              pipelinechannel--project_id:
                componentInputParameter: pipelinechannel--project_id
              pipelinechannel--region:
                componentInputParameter: pipelinechannel--region
              pipelinechannel--serving_container_image_uri:
                componentInputParameter: pipelinechannel--serving_container_image_uri
              pipelinechannel--state_key:
                componentInputParameter: pipelinechannel--state_key
              pipelinechannel--training_state_table:
                componentInputParameter: pipelinechannel--training_state_table
          taskInfo:
            name: xgboost-model
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--model_type'] == 'xgboost'
        refresh-provider-features-component:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-refresh-provider-features-component
          dependentTasks:
          - calculate-rolling-window-component
          inputs:
            parameters:
              claims_table:
                componentInputParameter: pipelinechannel--claims_table
              derived_feature_sql_json:
                componentInputParameter: pipelinechannel--derived_feature_sql_json
              feature_sql_json:
                componentInputParameter: pipelinechannel--feature_sql_json
              output_feature_table:
                componentInputParameter: pipelinechannel--feature_table
              project_id:
                componentInputParameter: pipelinechannel--project_id
              test_end_date:
                taskOutputParameter:
                  outputParameterKey: test_end_date
                  producerTask: calculate-rolling-window-component
              test_start_date:
                taskOutputParameter:
                  outputParameterKey: test_start_date
                  producerTask: calculate-rolling-window-component
              train_end_date:
                taskOutputParameter:
                  outputParameterKey: train_end_date
                  producerTask: calculate-rolling-window-component
              train_start_date:
                taskOutputParameter:
                  outputParameterKey: train_start_date
                  producerTask: calculate-rolling-window-component
          taskInfo:
            name: Refresh Provider Features
    inputDefinitions:
      parameters:
        pipelinechannel--check-retraining-decision-component-Output:
          parameterType: BOOLEAN
        pipelinechannel--claims_table:
          parameterType: STRING
        pipelinechannel--current_data_month:
          parameterType: STRING
        pipelinechannel--current_feature_signature:
          parameterType: STRING
        pipelinechannel--current_model_signature:
          parameterType: STRING
        pipelinechannel--derived_feature_sql_json:
          parameterType: STRING
        pipelinechannel--feature_columns_json:
          parameterType: STRING
        pipelinechannel--feature_sql_json:
          parameterType: STRING
        pipelinechannel--feature_table:
          parameterType: STRING
        pipelinechannel--model_artifact_uri:
          parameterType: STRING
        pipelinechannel--model_display_name:
