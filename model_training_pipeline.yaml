pipelineInfo:
  description: Reusable provider-level fraud detection pipeline supporting Random
    Forest and XGBoost with shared feature engineering, retraining logic, model registration,
    and manual approval.
  name: fraud-model-training
root:
  dag:
    tasks:
      check-retraining-decision-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-check-retraining-decision-component
        inputs:
          parameters:
            current_data_month:
              componentInputParameter: current_data_month
            current_feature_signature:
              componentInputParameter: current_feature_signature
            current_model_signature:
              componentInputParameter: current_model_signature
            current_model_type:
              componentInputParameter: model_type
            data_quality_table:
              componentInputParameter: data_quality_table
            feature_drift_table:
              componentInputParameter: feature_drift_table
            prediction_drift_table:
              componentInputParameter: prediction_drift_table
            project_id:
              componentInputParameter: project_id
            state_key:
              componentInputParameter: state_key
            training_state_table:
              componentInputParameter: training_state_table
        taskInfo:
          name: Check Retraining Decision
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - check-retraining-decision-component
        inputs:
          parameters:
            pipelinechannel--check-retraining-decision-component-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: check-retraining-decision-component
            pipelinechannel--claims_table:
              componentInputParameter: claims_table
            pipelinechannel--current_data_month:
              componentInputParameter: current_data_month
            pipelinechannel--current_feature_signature:
              componentInputParameter: current_feature_signature
            pipelinechannel--current_model_signature:
              componentInputParameter: current_model_signature
            pipelinechannel--derived_feature_sql_json:
              componentInputParameter: derived_feature_sql_json
            pipelinechannel--feature_columns_json:
              componentInputParameter: feature_columns_json
            pipelinechannel--feature_sql_json:
              componentInputParameter: feature_sql_json
            pipelinechannel--feature_table:
              componentInputParameter: feature_table
            pipelinechannel--model_artifact_uri:
              componentInputParameter: model_artifact_uri
            pipelinechannel--model_display_name:
              componentInputParameter: model_display_name
            pipelinechannel--model_output_uri:
              componentInputParameter: model_output_uri
            pipelinechannel--model_parameters_json:
              componentInputParameter: model_parameters_json
            pipelinechannel--model_type:
              componentInputParameter: model_type
            pipelinechannel--project_id:
              componentInputParameter: project_id
            pipelinechannel--region:
              componentInputParameter: region
            pipelinechannel--serving_container_image_uri:
              componentInputParameter: serving_container_image_uri
            pipelinechannel--state_key:
              componentInputParameter: state_key
            pipelinechannel--testing_months:
              componentInputParameter: testing_months
            pipelinechannel--training_months:
              componentInputParameter: training_months
            pipelinechannel--training_state_table:
              componentInputParameter: training_state_table
        taskInfo:
          name: retraining-required
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--check-retraining-decision-component-Output']
            == true
  inputDefinitions:
    parameters:
      claims_table:
        parameterType: STRING
      current_data_month:
        parameterType: STRING
      current_feature_signature:
        parameterType: STRING
      current_model_signature:
        parameterType: STRING
      data_quality_table:
        parameterType: STRING
      derived_feature_sql_json:
        parameterType: STRING
      feature_columns_json:
        parameterType: STRING
      feature_drift_table:
        parameterType: STRING
      feature_sql_json:
        parameterType: STRING
      feature_table:
        parameterType: STRING
      model_artifact_uri:
        parameterType: STRING
      model_display_name:
        parameterType: STRING
      model_name:
        parameterType: STRING
      model_output_uri:
        parameterType: STRING
      model_parameters_json:
        parameterType: STRING
      model_type:
        parameterType: STRING
      prediction_drift_table:
        parameterType: STRING
      project_id:
        parameterType: STRING
      region:
        parameterType: STRING
      serving_container_image_uri:
        parameterType: STRING
      state_key:
        defaultValue: provider_fraud_model_rf
        isOptional: true
        parameterType: STRING
