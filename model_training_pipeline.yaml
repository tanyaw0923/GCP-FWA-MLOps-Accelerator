deploymentSpec:
  executors:
    exec-calculate-rolling-window-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - calculate_rolling_window_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef calculate_rolling_window_component(\n    current_data_month:\
          \ str,\n    training_months: int,\n    testing_months: int,\n) -> NamedTuple(\n\
          \    \"Outputs\",\n    [\n        (\"train_start_date\", str),\n       \
          \ (\"train_end_date\", str),\n        (\"test_start_date\", str),\n    \
          \    (\"test_end_date\", str),\n    ],\n):\n    import calendar\n    from\
          \ datetime import date\n    from typing import NamedTuple\n\n    # ---------------------------------------------------------\n\
          \    # Move a year/month pair forward or backward.\n    # ---------------------------------------------------------\n\
          \    def add_months(\n        year,\n        month,\n        offset,\n \
          \   ):\n        month_index = (\n            year * 12\n            + month\n\
          \            - 1\n            + offset\n        )\n\n        new_year =\
          \ (\n            month_index // 12\n        )\n\n        new_month = (\n\
          \            month_index % 12\n            + 1\n        )\n\n        return\
          \ (\n            new_year,\n            new_month,\n        )\n\n    # ---------------------------------------------------------\n\
          \    # Return the last day of a month.\n    # ---------------------------------------------------------\n\
          \    def month_end(\n        year,\n        month,\n    ):\n        final_day\
          \ = (\n            calendar.monthrange(\n                year,\n       \
          \         month,\n            )[1]\n        )\n\n        return date(\n\
          \            year,\n            month,\n            final_day,\n       \
          \ )\n\n    current = date.fromisoformat(\n        current_data_month\n \
          \   )\n\n    # ---------------------------------------------------------\n\
          \    # TEST window\n    #\n    # The latest complete month is included in\
          \ TEST.\n    #\n    # Example:\n    #\n    # current_data_month = October\n\
          \    # testing_months = 3\n    #\n    # TEST = Aug - Oct\n    # ---------------------------------------------------------\n\
          \    test_end = month_end(\n        current.year,\n        current.month,\n\
          \    )\n\n    (\n        test_start_year,\n        test_start_month,\n \
          \   ) = add_months(\n        current.year,\n        current.month,\n   \
          \     -(testing_months - 1),\n    )\n\n    test_start = date(\n        test_start_year,\n\
          \        test_start_month,\n        1,\n    )\n\n    # ---------------------------------------------------------\n\
          \    # TRAIN ends immediately before TEST begins.\n    # ---------------------------------------------------------\n\
          \    (\n        train_end_year,\n        train_end_month,\n    ) = add_months(\n\
          \        test_start_year,\n        test_start_month,\n        -1,\n    )\n\
          \n    train_end = month_end(\n        train_end_year,\n        train_end_month,\n\
          \    )\n\n    # ---------------------------------------------------------\n\
          \    # TRAIN contains the configured number of complete months.\n    #\n\
          \    # Example:\n    #\n    # training_months = 6\n    #\n    # TRAIN =\
          \ Feb - Jul\n    # ---------------------------------------------------------\n\
          \    (\n        train_start_year,\n        train_start_month,\n    ) = add_months(\n\
          \        train_end_year,\n        train_end_month,\n        -(training_months\
          \ - 1),\n    )\n\n    train_start = date(\n        train_start_year,\n \
          \       train_start_month,\n        1,\n    )\n\n    print(\"=\" * 60)\n\
          \    print(\"Rolling Train / Test Window\")\n    print(\"=\" * 60)\n\n \
          \   print(\n        f\"Current data month: \"\n        f\"{current_data_month}\"\
          \n    )\n\n    print(\n        f\"Training months: \"\n        f\"{training_months}\"\
          \n    )\n\n    print(\n        f\"Testing months: \"\n        f\"{testing_months}\"\
          \n    )\n\n    print(\n        f\"\\nTRAIN: \"\n        f\"{train_start}\
          \ -> {train_end}\"\n    )\n\n    print(\n        f\"TEST:  \"\n        f\"\
          {test_start} -> {test_end}\"\n    )\n\n    outputs = NamedTuple(\n     \
          \   \"Outputs\",\n        [\n            (\"train_start_date\", str),\n\
          \            (\"train_end_date\", str),\n            (\"test_start_date\"\
          , str),\n            (\"test_end_date\", str),\n        ],\n    )\n\n  \
          \  return outputs(\n        train_start.isoformat(),\n        train_end.isoformat(),\n\
          \        test_start.isoformat(),\n        test_end.isoformat(),\n    )\n\
          \n"
        image: python:3.11
    exec-check-retraining-decision-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - check_retraining_decision_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-bigquery'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef check_retraining_decision_component(\n    project_id: str,\n\
          \    current_data_month: str,\n    current_feature_signature: str,\n   \
          \ current_model_signature: str,\n    current_model_type: str,\n    data_quality_table:\
          \ str,\n    feature_drift_table: str,\n    prediction_drift_table: str,\n\
          \    training_state_table: str,\n    state_key: str = \"provider_fraud_model_rf\"\
          ,\n) -> bool:\n    from datetime import date\n\n    from google.cloud import\
          \ bigquery\n\n    bq = bigquery.Client(\n        project=project_id\n  \
          \  )\n\n    # ---------------------------------------------------------\n\
          \    # 1. Data quality trigger\n    # ---------------------------------------------------------\n\
          \n    data_quality_query = f\"\"\"\n    SELECT\n      monitoring_status\n\
          \    FROM `{data_quality_table}`\n    ORDER BY monitoring_timestamp DESC\n\
          \    LIMIT 1\n    \"\"\"\n\n    data_quality_rows = list(\n        bq.query(\n\
          \            data_quality_query\n        ).result()\n    )\n\n    data_quality_status\
          \ = (\n        data_quality_rows[0].monitoring_status\n        if data_quality_rows\n\
          \        else \"PASS\"\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 2. Feature drift trigger\n    #\n    # Evaluate only the latest monitoring\
          \ run.\n    # ---------------------------------------------------------\n\
          \n    feature_drift_query = f\"\"\"\n    SELECT\n      COUNTIF(\n      \
          \  monitoring_status = 'ALERT'\n      ) AS alert_count\n    FROM `{feature_drift_table}`\n\
          \    WHERE monitoring_timestamp = (\n      SELECT\n        MAX(monitoring_timestamp)\n\
          \      FROM `{feature_drift_table}`\n    )\n    \"\"\"\n\n    feature_drift_rows\
          \ = list(\n        bq.query(\n            feature_drift_query\n        ).result()\n\
          \    )\n\n    feature_alert_count = (\n        feature_drift_rows[0].alert_count\n\
          \        if feature_drift_rows\n        else 0\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 3. Prediction drift trigger\n    #\n    # prediction_drift uses:\n\
          \    #   status\n    #   check_date\n    # ---------------------------------------------------------\n\
          \n    prediction_drift_query = f\"\"\"\n    SELECT\n      status\n    FROM\
          \ `{prediction_drift_table}`\n    ORDER BY check_date DESC\n    LIMIT 1\n\
          \    \"\"\"\n\n    prediction_drift_rows = list(\n        bq.query(\n  \
          \          prediction_drift_query\n        ).result()\n    )\n\n    prediction_drift_status\
          \ = (\n        prediction_drift_rows[0].status\n        if prediction_drift_rows\n\
          \        else \"PASS\"\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 4. Read approved production state\n    #\n    # state_key identifies\
          \ the fraud workflow, not an algorithm.\n    #\n    # Random Forest and\
          \ XGBoost therefore compare against the\n    # same approved production\
          \ baseline.\n    # ---------------------------------------------------------\n\
          \n    training_state_query = f\"\"\"\n    SELECT\n      last_training_data_month,\n\
          \      approved_feature_signature,\n      approved_model_signature,\n  \
          \    approved_model_type\n    FROM `{training_state_table}`\n    WHERE model_name\
          \ = @state_key\n    LIMIT 1\n    \"\"\"\n\n    job_config = bigquery.QueryJobConfig(\n\
          \        query_parameters=[\n            bigquery.ScalarQueryParameter(\n\
          \                \"state_key\",\n                \"STRING\",\n         \
          \       state_key,\n            )\n        ]\n    )\n\n    training_state_rows\
          \ = list(\n        bq.query(\n            training_state_query,\n      \
          \      job_config=job_config,\n        ).result()\n    )\n\n    if training_state_rows:\n\
          \        state = training_state_rows[0]\n\n        last_training_data_month\
          \ = (\n            state.last_training_data_month\n        )\n\n       \
          \ approved_feature_signature = (\n            state.approved_feature_signature\n\
          \        )\n\n        approved_model_signature = (\n            state.approved_model_signature\n\
          \        )\n\n        approved_model_type = (\n            state.approved_model_type\n\
          \        )\n\n    else:\n        last_training_data_month = None\n     \
          \   approved_feature_signature = None\n        approved_model_signature\
          \ = None\n        approved_model_type = None\n\n    # ---------------------------------------------------------\n\
          \    # 5. Use Case 1\n    #\n    # New monthly data becomes available.\n\
          \    # ---------------------------------------------------------\n\n   \
          \ current_data_month_date = (\n        date.fromisoformat(\n           \
          \ current_data_month\n        )\n    )\n\n    new_month_available = (\n\
          \        last_training_data_month is None\n        or current_data_month_date\n\
          \        > last_training_data_month\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 6. Use Case 2\n    #\n    # Feature configuration changed.\n    #\
          \ ---------------------------------------------------------\n\n    feature_set_changed\
          \ = (\n        approved_feature_signature is not None\n        and current_feature_signature\n\
          \        != approved_feature_signature\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 7. Use Case 3\n    #\n    # Model type or model parameters changed.\n\
          \    #\n    # The model signature contains:\n    #   model_type\n    # \
          \  model_name\n    #   hyperparameters\n    #\n    # Example:\n    #\n \
          \   # random_forest\n    #       \u2193\n    # xgboost\n    #\n    # produces\
          \ a different signature.\n    # ---------------------------------------------------------\n\
          \n    model_configuration_changed = (\n        approved_model_signature\
          \ is not None\n        and current_model_signature\n        != approved_model_signature\n\
          \    )\n\n    # ---------------------------------------------------------\n\
          \    # 8. Final retraining decision\n    # ---------------------------------------------------------\n\
          \n    should_retrain = (\n        data_quality_status == \"ALERT\"\n   \
          \     or feature_alert_count > 0\n        or prediction_drift_status ==\
          \ \"ALERT\"\n        or new_month_available\n        or feature_set_changed\n\
          \        or model_configuration_changed\n    )\n\n    # ---------------------------------------------------------\n\
          \    # 9. Collect retraining reasons\n    # ---------------------------------------------------------\n\
          \n    reasons = []\n\n    if data_quality_status == \"ALERT\":\n       \
          \ reasons.append(\n            \"data_quality_alert\"\n        )\n\n   \
          \ if feature_alert_count > 0:\n        reasons.append(\n            \"feature_drift_alert\"\
          \n        )\n\n    if prediction_drift_status == \"ALERT\":\n        reasons.append(\n\
          \            \"prediction_drift_alert\"\n        )\n\n    if new_month_available:\n\
          \        reasons.append(\n            \"new_month_data\"\n        )\n\n\
          \    if feature_set_changed:\n        reasons.append(\n            \"feature_set_changed\"\
          \n        )\n\n    if model_configuration_changed:\n        reasons.append(\n\
          \            \"model_configuration_changed\"\n        )\n\n    # ---------------------------------------------------------\n\
          \    # 10. Decision summary\n    # ---------------------------------------------------------\n\
          \n    print(\"=\" * 70)\n    print(\"FWA Retraining Decision\")\n    print(\"\
          =\" * 70)\n\n    print(\n        f\"State key: \"\n        f\"{state_key}\"\
          \n    )\n\n    print(\"\\nMONITORING\")\n    print(\"-\" * 70)\n\n    print(\n\
          \        f\"Data Quality Status: \"\n        f\"{data_quality_status}\"\n\
          \    )\n\n    print(\n        f\"Feature Drift Alert Count: \"\n       \
          \ f\"{feature_alert_count}\"\n    )\n\n    print(\n        f\"Prediction\
          \ Drift Status: \"\n        f\"{prediction_drift_status}\"\n    )\n\n  \
          \  print(\"\\nUSE CASE 1 - DATA\")\n    print(\"-\" * 70)\n\n    print(\n\
          \        f\"Current Data Month: \"\n        f\"{current_data_month_date}\"\
          \n    )\n\n    print(\n        f\"Last Training Data Month: \"\n       \
          \ f\"{last_training_data_month}\"\n    )\n\n    print(\n        f\"New Month\
          \ Available: \"\n        f\"{new_month_available}\"\n    )\n\n    print(\"\
          \\nUSE CASE 2 - FEATURES\")\n    print(\"-\" * 70)\n\n    print(\n     \
          \   \"Approved Feature Signature: \"\n        f\"{approved_feature_signature}\"\
          \n    )\n\n    print(\n        \"Current Feature Signature: \"\n       \
          \ f\"{current_feature_signature}\"\n    )\n\n    print(\n        f\"Feature\
          \ Set Changed: \"\n        f\"{feature_set_changed}\"\n    )\n\n    print(\"\
          \\nUSE CASE 3 - MODEL\")\n    print(\"-\" * 70)\n\n    print(\n        f\"\
          Approved Model Type: \"\n        f\"{approved_model_type}\"\n    )\n\n \
          \   print(\n        f\"Current Model Type: \"\n        f\"{current_model_type}\"\
          \n    )\n\n    print(\n        \"Approved Model Signature: \"\n        f\"\
          {approved_model_signature}\"\n    )\n\n    print(\n        \"Current Model\
          \ Signature: \"\n        f\"{current_model_signature}\"\n    )\n\n    print(\n\
          \        f\"Model Configuration Changed: \"\n        f\"{model_configuration_changed}\"\
          \n    )\n\n    print(\"\\n\" + \"=\" * 70)\n\n    print(\n        f\"Should\
          \ Retrain: \"\n        f\"{should_retrain}\"\n    )\n\n    if reasons:\n\
          \        print(\n            \"\\nRetraining trigger(s):\"\n        )\n\n\
          \        for reason in reasons:\n            print(\n                f\"\
          \  - {reason}\"\n            )\n\n    else:\n        print(\n          \
          \  \"\\nNo retraining triggers detected.\"\n        )\n\n    return should_retrain\n\
          \n"
