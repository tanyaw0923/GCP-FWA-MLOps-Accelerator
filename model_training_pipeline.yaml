        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model_component(\n    project_id: str,\n    region:\
          \ str,\n    model_display_name: str,\n    artifact_uri: str,\n    serving_container_image_uri:\
          \ str,\n) -> str:\n    from google.cloud import aiplatform\n\n    aiplatform.init(\n\
          \        project=project_id,\n        location=region,\n    )\n\n    print(\"\
          =\" * 60)\n    print(\"Registering Random Forest Model\")\n    print(\"\
          =\" * 60)\n\n    print(\n        f\"Project: \"\n        f\"{project_id}\"\
          \n    )\n\n    print(\n        f\"Region: \"\n        f\"{region}\"\n  \
          \  )\n\n    print(\n        f\"Model display name: \"\n        f\"{model_display_name}\"\
          \n    )\n\n    print(\n        f\"Artifact URI: \"\n        f\"{artifact_uri}\"\
          \n    )\n\n    print(\n        f\"Serving container: \"\n        f\"{serving_container_image_uri}\"\
          \n    )\n\n    model = aiplatform.Model.upload(\n        display_name=model_display_name,\n\
          \        artifact_uri=artifact_uri,\n        serving_container_image_uri=serving_container_image_uri,\n\
          \        sync=True,\n    )\n\n    print(\"\\nModel registered successfully.\"\
          )\n\n    print(\n        f\"Model resource name: \"\n        f\"{model.resource_name}\"\
          \n    )\n\n    return model.resource_name\n\n"
